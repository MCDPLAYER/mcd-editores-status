<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCD ANIMES · Central dos Editores</title>
<style>
  :root { --accent:#6cf; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0d0d0d; color:#eee; font-family:system-ui,Segoe UI,sans-serif; padding:24px; }
  .card { background:#1c1c1c; border:1px solid #2a2a2a; border-radius:16px; padding:40px 32px;
          width:100%; max-width:420px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  h1 { margin:0; color:var(--accent); font-size:1.6rem; letter-spacing:.5px; }
  .sub { margin:4px 0 28px; color:#888; font-size:.95rem; }
  .state { display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:20px; }
  .dot { width:16px; height:16px; border-radius:50%; background:#555; transition:.3s; }
  .checking .dot { background:#caa14a; animation:pulse 1.2s infinite; }
  .online .dot { background:#3fbf6a; box-shadow:0 0 16px #3fbf6a88; }
  .offline .dot { background:#e0564f; box-shadow:0 0 16px #e0564f88; }
  #msg { font-size:1.25rem; font-weight:600; }
  .hint { color:#999; font-size:.9rem; line-height:1.5; margin:6px 0 0; min-height:1.2em; }
  .btn { display:none; margin-top:8px; padding:14px 28px; background:var(--accent); color:#06121a;
         font-weight:700; border-radius:10px; text-decoration:none; font-size:1.05rem; transition:.2s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px #6cf4; }
  .foot { margin-top:26px; color:#555; font-size:.75rem; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
</style>
</head>
<body>
  <div class="card">
    <h1>MCD ANIMES</h1>
    <p class="sub">Central dos Editores</p>
    <div id="state" class="state checking">
      <div class="dot"></div>
      <div id="msg">Verificando…</div>
    </div>
    <a id="enter" class="btn" href="#" target="_blank" rel="noopener">Entrar →</a>
    <p id="hint" class="hint"></p>
    <p class="foot">Atualiza sozinho a cada 15s · <span id="ts">—</span></p>
  </div>
<script>
  const APP = "https://crushing-tavern-clasp.ngrok-free.dev";
  const state = document.getElementById("state");
  const msg = document.getElementById("msg");
  const hint = document.getElementById("hint");
  const enter = document.getElementById("enter");
  const ts = document.getElementById("ts");
  enter.href = APP;

  async function check() {
    try {
      const r = await fetch(APP + "/health", { headers: { "ngrok-skip-browser-warning": "1" }, cache: "no-store" });
      if (!r.ok) throw new Error("status " + r.status);
      const d = await r.json();
      state.className = "state online";
      msg.textContent = "🟢 No ar!";
      enter.style.display = "inline-block";
      hint.textContent = `${d.clips} clips · ${d.sfx} SFX · ${d.canal_notes} notas`;
    } catch (e) {
      state.className = "state offline";
      msg.textContent = "🔴 Fora do ar";
      enter.style.display = "none";
      hint.textContent = "O PC do MCD está desligado. Manda mensagem pra ele que ele liga e já volta. 😉";
    }
    ts.textContent = new Date().toLocaleTimeString("pt-BR");
  }
  check();
  setInterval(check, 15000);
</script>
</body>
</html>
